name: Docker CI/CD for frontend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Testing part
    runs-on: ubuntu-latest
    defaults:
      run: 
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests
        working-directory: ./frontend
        run: npm test

  build:
    name: Building part
    runs-on: ubuntu-latest
    defaults:
      run: 
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setting up Docker builder
        uses: docker/setup-buildx-action@v3

      - name: Setting up Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERUSER }}
          password: ${{ secrets.DOCKERPASSWORD }}

      - name: Docker build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ vars.DOCKERUSER }}/devopsua6-pub:${{ github.sha }}
            ${{ vars.DOCKERUSER }}/devopsua6-pub:sha-${{ github.sha::7 }}