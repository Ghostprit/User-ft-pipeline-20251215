services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: pass123
      MYSQL_DATABASE: appdb
    ports:
      - "3307:3306"
    networks:
      - task-network
    volumes:
      - ./script.sql:/docker-entrypoint-initdb.d/script.sql
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppass123"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: app-be
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: pass123
      DB_NAME: appdb
    ports:
      - "3000:3000"
    networks:
      - task-network
    depends_on:
      mysql:
        condition: service_healthy
  
  frontend:
    build: ./frontend
    container_name: app-fe
    restart: unless-stopped
    ports:
      - "3001:80"
    networks:
      - task-network

volumes:
  db_data:

networks:
    task-network:
      driver: bridge